name: DispatchArc CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: dispatcharc-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: dispatcharc_tests
          POSTGRES_USER: dispatcharc_dev
          POSTGRES_PASSWORD: DispatchArcCiOnly

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U dispatcharc_dev -d dispatcharc_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DISPATCHARC_TEST_DATABASE: Host=localhost;Port=5432;Database=dispatcharc_tests;Username=dispatcharc_dev;Password=DispatchArcCiOnly

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.302"

      - name: Restore dependencies
        run: dotnet restore DispatchArc.sln

      - name: Build solution
        run: dotnet build DispatchArc.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test DispatchArc.sln --configuration Release --no-build --logger "console;verbosity=normal"
